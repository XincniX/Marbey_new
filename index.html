<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Marbey - متجر</title>
<style>
  :root{
    --accent:#c94b3b;
    --accent-dark:#b03d31;
    --muted:#777;
    --card-bg:#fff;
    --page-bg:#f5f5f7;
    --shadow: 0 6px 18px rgba(20,20,20,0.08);
    --radius:14px;
  }

  body{
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    background:var(--page-bg);
    color:#111;
    margin:0;
    padding:0;
    line-height:1.4;
  }

  /* نخلي الكونتينر كله رايح يمين الصفحة */
  .container{
    max-width:1100px;
    margin:30px 0 30px auto;  /* يمين */
    padding:0 18px;
  }

  header{
    display:flex;
    align-items:center;
    gap:20px;
    justify-content:flex-end; /* عناصر الهيدر يمين الكونتينر */
    padding:18px 0;
    position:relative;
    z-index:50;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:14px;
    flex-direction:row-reverse; /* اللوجو ثم النص ناحية اليمين */
  }

  .brand img{
    width:84px;
    height:84px;
    border-radius:16px;
    box-shadow:var(--shadow);
    background:#fff;
    padding:8px;
  }

  .brand h1{
    margin:0;
    font-size:28px;
    color:var(--accent);
    letter-spacing:0.5px;
  }

  .subtitle{
    color:#999;
    margin-top:6px;
    font-size:13px;
  }

  /* شريط البادجز الثابت على الشمال */
  .badges{
    position:fixed;
    left:24px;
    top:110px;
    display:flex;
    flex-direction:column;
    gap:10px;
    z-index:20;
  }

  .badge{
    max-width:260px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    background:#fff;
    padding:8px 12px;
    border-radius:20px;
    box-shadow:var(--shadow);
    font-size:14px;
    color:#444;
  }

  @media (max-width:700px){
    .badges{
      left:10px;
      top:20px;
      max-width:200px;
    }
  }

  /* Featured area */
  .featured{
    display:flex;
    align-items:flex-start;
    gap:28px;
    margin:22px 0 28px;
  }
  .featured .big{flex:1;}

  /* product cards */
  #products-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
    margin-top:18px;
  }

  .product-card{
    background:var(--card-bg);
    border-radius:14px;
    padding:12px;
    border:1px solid rgba(0,0,0,0.04);
    box-shadow:var(--shadow);
    text-align:center;
    direction:rtl;
  }

  .product-card img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:10px;
  }

  .product-card h3{
    margin:10px 0 6px;
    font-size:16px;
  }

  .price{
    color:var(--accent-dark);
    font-weight:700;
    margin-bottom:8px;
  }

  .btns{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-top:6px;
  }

  .btn{
    padding:8px 12px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    font-weight:600;
  }
  .btn-wats{background:#e74c3c;color:#fff}
  .btn-more{background:#2d72d9;color:#fff}

  /* شريط الفلترة */
  #category-bar{
    padding:12px;
    text-align:center;
    margin-top:26px;
  }

  .cat-btn{
    margin:6px;
    padding:8px 14px;
    border-radius:8px;
    border:1px solid #eee;
    background:#fff;
    cursor:pointer;
  }

  .cat-btn.active{
    background:var(--accent-dark);
    color:#fff;
  }

  .product.hidden{display:none !important}

  /* contact section */
  .contact{
    background:#fff;
    border-radius:12px;
    padding:18px;
    margin:36px 0;
    box-shadow:var(--shadow);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  .contact p{margin:0}
  .contact .actions{display:flex;gap:10px}

  .footer{
    background:#fff;
    border-radius:12px;
    padding:12px;
    margin:30px 0;
    text-align:center;
    color:#666;
    box-shadow:var(--shadow);
  }

  /* responsive */
  @media (max-width:900px){
    #products-grid{grid-template-columns:repeat(2,1fr)}
    .product-card img{height:180px}
  }
  @media (max-width:600px){
    #products-grid{grid-template-columns:1fr}
    .featured{flex-direction:column}
    header{flex-direction:column;align-items:flex-end}
    .badges{left:8px;top:8px}
  }
</style>
</head>
<body>
<div class="badges">
  <div class="badge">العنوان: ماربي للأحذية - شارع العروبة - الهرم</div>
  <div class="badge">صفحتنا على الفيسبوك</div>
  <div class="badge">تواصل عبر واتساب</div>
</div>

<div class="container">
  <header>
    <div class="brand">
      <img src="assets/logo.png" alt="Marbey logo">
      <div style="text-align:right;">
        <h1>ماربي للأزياء النسائية</h1>
        <div class="subtitle">لمسة أناقة في كل خطوة</div>
      </div>
    </div>
  </header>

  <!-- Featured / top products -->
  <section class="featured">
    <div class="big">
      <h2 style="margin:0 0 8px 0;color:#222">الأكثر مبيعاً</h2>
      <div id="products-grid" aria-live="polite">
        <!-- products injected here -->
      </div>
    </div>
  </section>

  <!-- categories: القيم (data-cat) = bag / shoes زي الـ JSON -->
  <div id="category-bar">
    <button class="cat-btn" data-cat="all">الكل</button>
    <button class="cat-btn" data-cat="shoes">أحذية</button>
    <button class="cat-btn" data-cat="bag">شنط</button>
  </div>

  <!-- contact -->
  <div class="contact" role="region" aria-label="تواصل سريع">
    <div>
      <h3 style="margin:0 0 6px 0">تواصل سريع</h3>
      <p style="color:var(--muted);margin:0">
        هل تريد مساعدة سريعة؟ اضغط على أيقونة الواتساب للتواصل المباشر.
      </p>
    </div>
    <div class="actions">
      <button class="btn btn-more"
              onclick="window.open('https://facebook.com','_blank')">
        شاهد صفحتنا على فيسبوك
      </button>
      <button class="btn btn-wats"
              onclick="window.open('https://wa.me/201234567890','_blank')">
        راسلنا الآن
      </button>
    </div>
  </div>

  <div class="footer">
    تصميم الموقع تجريبي و تحت الانشاء — © MARBEY
  </div>
</div>

<!-- dynamic products script -->
<script>
document.addEventListener('DOMContentLoaded', function(){
  const grid = document.getElementById('products-grid');
  const placeholderImg = 'images/placeholder.jpg'; // لو مفيش حط أي صورة مكانها

  function renderProducts(products){
    grid.innerHTML = '';
    products.forEach(p => {
      const art = document.createElement('article');
      art.className = 'product-card';
      art.setAttribute('data-product-item','');
      art.setAttribute('data-category', p.ItemCategory || 'unknown');

      const fileName = p.ItemImage || '';
      const imgPath = fileName
        ? `images/${encodeURIComponent(fileName)}`
        : placeholderImg;

      art.innerHTML = `
        <img src="${imgPath}" alt="${p.ItemName}"
             onerror="this.src='${placeholderImg}'">
        <h3>${p.ItemName}</h3>
        <div class="price">
          ${p.ItemPrice == null ? '' : ('EGP ' + p.ItemPrice)}
        </div>
        <div class="btns">
          <button class="btn btn-wats"
            onclick="window.open('https://wa.me/201234567890?text=' + encodeURIComponent('اهلاً، استفسار عن: ${p.ItemName}'),'_blank')">
            واتساب
          </button>
          <button class="btn btn-more"
            onclick="alert('تفاصيل المنتج: ${p.ItemName}')">
            المزيد
          </button>
        </div>
      `;
      grid.appendChild(art);
    });

    // طبّق الفلتر الحالي بعد ما نرندر
    const activeBtn =
      document.querySelector('.cat-btn.active') ||
      document.querySelector('.cat-btn[data-cat="all"]');
    if (activeBtn) applyFilter(activeBtn.getAttribute('data-cat'));
  }

  // تحميل ملف المنتجات
  fetch('products.json')
    .then(resp => {
      if(!resp.ok) throw new Error('products.json not found (HTTP ' + resp.status + ')');
      return resp.json();
    })
    .then(json => {
      const products = Array.isArray(json) ? json : [];
      renderProducts(products);
    })
    .catch(err => {
      console.error(err);
      grid.innerHTML =
        '<p style="padding:16px;color:#900">خطأ: تعذّر تحميل ملف المنتجات — تأكد أن products.json موجود في نفس مجلد index.html.</p>';
    });

  // منطق الفلترة
  const buttons = Array.from(document.querySelectorAll('.cat-btn'));

  function setActive(btn){
    buttons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function applyFilter(cat){
    const all = document.querySelectorAll('[data-product-item]');
    all.forEach(el => {
      if (cat === 'all') {
        el.classList.remove('hidden');
      } else {
        const prodCat = el.getAttribute('data-category') || '';
        if (prodCat === cat) el.classList.remove('hidden');
        else el.classList.add('hidden');
      }
    });
  }

  buttons.forEach(btn => {
    btn.addEventListener('click', function(){
      const c = this.getAttribute('data-cat');
      setActive(this);
      applyFilter(c);
    });
  });

  // افتراضياً: الكل مفعّل
  const defaultBtn = document.querySelector('.cat-btn[data-cat="all"]');
  if (defaultBtn) defaultBtn.classList.add('active');
});
</script>

</body>
</html>
